  /api/v1/tutor/sessions:
    get:
      tags:
      - Tutor
      summary: 'Возвращает список чат-сессий текущего пользователя.

        По умолчанию исключает архивные сессии. Параметр includeArchived

        позволяет получить все сессии, включая архивированные.

        Результат отсортирован по дате последнего сообщения, максимум 100 записей.'
      parameters:
      - name: includeArchived
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatSessionResponse'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatSessionResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatSessionResponse'
    post:
      tags:
      - Tutor
      summary: 'Создаёт новую чат-сессию с ИИ-репетитором.

        Инициализирует сессию с заданными параметрами: режим общения,

        уровень языка, сценарий и настройки провайдера ИИ.

        Возвращает созданную сессию с кодом 201 Created.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartChatSessionRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/StartChatSessionRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/StartChatSessionRequest'
      responses:
        '201':
          description: Created
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ChatSessionResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ChatSessionResponse'
  /api/v1/tutor/sessions/{sessionId}:
    get:
      tags:
      - Tutor
      summary: 'Возвращает конкретную чат-сессию по идентификатору.

        Включает все сообщения сессии. Доступна только владельцу сессии —

        при попытке доступа к чужой сессии возвращается 404 Not Found.'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ChatSessionResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ChatSessionResponse'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      tags:
      - Tutor
      summary: 'Переименовывает чат-сессию.

        Позволяет пользователю задать понятное название для сессии,

        чтобы было проще ориентироваться в списке диалогов.

        Возвращает обновлённую сессию с сообщениями.'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameSessionRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/RenameSessionRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RenameSessionRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ChatSessionResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ChatSessionResponse'
    delete:
      tags:
      - Tutor
      summary: 'Полностью удаляет чат-сессию и все её сообщения.

        Операция необратима — данные удаляются из базы навсегда.

        Доступна только владельцу сессии.'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
  /api/v1/tutor/sessions/{sessionId}/messages:
    get:
      tags:
      - Tutor
      summary: 'Возвращает историю сообщений указанной чат-сессии.

        Поддерживает пагинацию через параметр before (получение сообщений

        раньше указанной даты) и ограничение количества через limit (1–500).

        Сообщения возвращаются в хронологическом порядке.'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: before
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: 200
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessageResponse'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessageResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessageResponse'
    post:
      tags:
      - Tutor
      summary: 'Отправляет сообщение в чат-сессию и получает ответ ИИ-репетитора.

        Возвращает пару сообщений (пользователь + ассистент), количество

        использованных токенов, задержку ответа и контекст из словаря (RAG),

        который был использован для формирования ответа.'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SendChatMessageResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/SendChatMessageResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/SendChatMessageResponse'
  /api/v1/tutor/sessions/{sessionId}/messages/stream:
    post:
      tags:
      - Tutor
      summary: 'Отправляет сообщение в чат-сессию и стримит ответ ИИ в реальном времени.

        Использует формат Server-Sent Events (SSE) для передачи частей ответа

        по мере их генерации. События: delta (фрагмент текста), done (полный текст),

        error (сообщение об ошибке). Это создаёт эффект "печатания" в интерфейсе.'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
      responses:
        '200':
          description: OK
  /api/v1/tutor/sessions/{sessionId}/messages/{messageId}/regenerate:
    post:
      tags:
      - Tutor
      summary: 'Перегенерирует ответ ИИ на указанное сообщение пользователя.

        Полезно, когда пользователь хочет получить альтернативный вариант ответа.

        Заменяет существующее сообщение ассистента новым ответом,

        сохраняя контекст диалога.'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
  /api/v1/tutor/sessions/{sessionId}/archive:
    post:
      tags:
      - Tutor
      summary: 'Архивирует или разархивирует чат-сессию.

        Архивные сессии скрываются из основного списка, но сохраняются

        в базе данных. Параметр archived=false возвращает сессию в активные.'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: archived
        in: query
        schema:
          type: boolean
          default: true
      responses:
        '204':
          description: No Content
  /api/v1/tutor/messages/{messageId}/feedback:
    post:
      tags:
      - Tutor
      summary: 'Сохраняет оценку пользователем ответа ИИ-репетитора.

        Используется для сбора обратной связи о качестве ответов,

        что помогает улучшать систему и анализировать эффективность ИИ.'
      parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '204':
          description: No Content
  /api/v1/tutor/usage:
    get:
      tags:
      - Tutor
      summary: 'Возвращает статистику использования ИИ-сервисов пользователем.

        Включает количество вызовов, потреблённые токены, оценочную стоимость

        и разбивку по провайдерам и дням. Параметр days определяет период

        анализа (1–365 дней). Помогает контролировать расход ресурсов.'
      parameters:
      - name: days
        in: query
        schema:
          type: integer
          format: int32
          default: 30
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AiUsageResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AiUsageResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AiUsageResponse'
  /api/v1/users/me:
    get:
      tags:
      - Users
      summary: 'Возвращает полный профиль текущего аутентифицированного пользователя.

        Включает информацию о языках обучения, уровне, статистике и настройках.

        Используется для отображения личного кабинета и страницы настроек.'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UserResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    patch:
      tags:
      - Users
      summary: 'Обновляет настройки профиля текущего пользователя.

        Позволяет изменить отображаемое имя, аватар, языки обучения,

        уровень, дневную цель XP, скорость речи и другие параметры.

        Принимает только переданные поля — остальные остаются без изменений.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UserResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
  /api/v1/users/me/dashboard:
    get:
      tags:
      - Users
      summary: 'Возвращает агрегированные данные для дашборда пользователя.

        Включает статистику изучения слов, количество карточек к повторению,

        активность за период, рекомендуемые слова и прогресс по дневной цели.

        Параметр activityDays определяет глубину истории (1–90 дней).'
      parameters:
      - name: activityDays
        in: query
        schema:
          type: integer
          format: int32
          default: 14
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
  /api/v1/users/me/stats:
    get:
      tags:
      - Users
      summary: 'Возвращает ежедневную статистику активности пользователя за указанный
        период.

        Содержит данные о заработанном XP, количестве повторений, правильных ответах,

        новых словах и времени обучения для каждого дня. Используется для графиков

        и визуализации прогресса обучения.'
      parameters:
      - name: days
        in: query
        schema:
          type: integer
          format: int32
          default: 30
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityResponse'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityResponse'
  /api/v1/users/me/goal:
    get:
      tags:
      - Users
      summary: 'Возвращает текущий прогресс по дневной цели XP.

        Показывает, сколько XP заработано сегодня, достигнута ли цель,

        а также текущую и максимальную серию дней подряд (streak).

        Используется для отображения виджета цели на главной странице.'
      responses:
        '200':
          description: OK
components:
  schemas:
    ActivityResponse:
      type: object
      properties:
        date:
          type: string
          format: date
        xpEarned:
          type: integer
          format: int32
        reviewsCompleted:
          type: integer
          format: int32
        correctAnswers:
          type: integer
          format: int32
        newWordsLearned:
          type: integer
          format: int32
        exercisesCompleted:
          type: integer
          format: int32
        minutesStudied:
          type: integer
          format: int32
      additionalProperties: false
    AddGroupMemberRequest:

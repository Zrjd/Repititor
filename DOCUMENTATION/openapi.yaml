          format: int32
      - name: PageSize
        in: query
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserWordResponse'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserWordResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserWordResponse'
    post:
      tags:
      - Decks
      summary: 'Добавляет слова в существующую колоду.

        Возвращает количество фактически добавленных карточек (без дубликатов) и общий
        размер колоды.

        Если слово уже есть у пользователя, оно будет привязано к колоде; если нет

      tags:
      - Auth
      summary: 'Аутентифицирует пользователя по email и паролю.

        Проверяет учётные данные, при необходимости перехеширует пароль

        и выдаёт новую пару токенов доступа (access + refresh).'
      requestBody:
        content:
          application/json:
            schema:

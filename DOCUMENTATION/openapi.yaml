      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeckResponse'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeckResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeckResponse'
    post:
      tags:
      - Decks
      summary: 'Создаёт новую колоду карточек.

        В запросе можно указать название, описание, язык, обложку (эмодзи) и теги.

        Также можно сразу передать список слов, которые будут добавлены в колоду.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeckRequest'
          text/json:

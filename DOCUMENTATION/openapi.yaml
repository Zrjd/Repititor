                $ref: '#/components/schemas/LexicalUnitResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/LexicalUnitResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/LexicalUnitResponse'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      tags:
      - Dictionary
      summary: 'Обновляет информацию о существующем слове в словаре.

        Обновляются только переданные поля; остальные данные остаются без изменений.

        Если изменился текст или перевод, автоматически пересчитывается векторное
        представление.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLexicalUnitRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateLexicalUnitRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateLexicalUnitRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/LexicalUnitResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/LexicalUnitResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/LexicalUnitResponse'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
      - Dictionary
      summary: 'Удаляет (помечает как устаревшее) слово из словаря.

        Удаление мягкое — слово помечается как Deprecated и скрывается из поиска,
        но данные сохраняются.

        Удалить слово может только его автор или администратор/учитель.'

            schema:
              $ref: '#/components/schemas/DeckCardsRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: {}
            application/json:
              schema: {}
            text/json:
              schema: {}
  /api/v1/decks/{id}/cards/{lexicalUnitId}:
    delete:
      tags:
      - Decks
      summary: 'Удаляет карточку из колоды, но не из словаря.

        Слово остаётся в личном словаре пользователя и продолжит участвовать в повторениях,
        просто исчезнет из этой колоды.

        Используется для наполнения колоды только теми словами, которые пользователь
        хочет повторять в данном контексте.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lexicalUnitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
  /api/v1/decks/{id}/reset-progress:
    post:
      tags:
      - Decks
      summary: 'Сбрасывает прогресс изучения всех карточек в колоде.

        Все интервалы, повторения и статистика обнуляются — карточки становятся "новыми"
        и готовы к повторению с нуля.

        Используется, если пользователь хочет начать изучение колоды заново.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

              $ref: '#/components/schemas/ImportWordsRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ImportWordsResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ImportWordsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ImportWordsResponse'

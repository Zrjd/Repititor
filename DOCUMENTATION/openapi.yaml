  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: 'Обновляет пару токенов доступа по refresh-токену.

        Реализует механизм ротации: старый refresh-токен отзывается,

        а пользователь получает новую пару токенов. Это повышает безопасность,

        предотвращая повторное использование скомпрометированных токенов.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TokenResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: 'Завершает текущую сессию пользователя, отзывая указанный refresh-токен.

        Токен может быть передан в заголовке X-Refresh-Token или в теле запроса.

        Если токен не передан, запрос считается успешным без ошибки.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: No Content
  /api/v1/auth/logout-all:
    post:
      tags:
      - Auth
      summary: 'Завершает все активные сессии пользователя, отзывая все его refresh-токены.

        Используется, например, при подозрении на компрометацию аккаунта

        или при смене пароля для принудительного перелогина на всех устройствах.'

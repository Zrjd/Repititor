                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      tags:
      - Exercises
      summary: 'Возвращает историю попыток текущего пользователя по конкретному упражнению.

        Показывает прошлые результаты в обратном хронологическом порядке, чтобы пользователь
        мог отследить свой прогресс.

        Количество записей можно ограничить параметром limit.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseAttemptResponse'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseAttemptResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseAttemptResponse'
  /api/v1/exercises/history:
    get:
      tags:
      - Exercises
      summary: 'Возвращает общую историю всех попыток текущего пользователя по всем
        упражнениям.

        Используется для страницы "Моя активность" или "История" в профиле пользователя.

        Записи сортируются по дате выполнения (новые сверху), количество ограничено
        параметром limit.'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseAttemptResponse'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseAttemptResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseAttemptResponse'
  /api/v1/exercises/recommended:
    get:
      tags:
      - Exercises
      summary: 'Возвращает список рекомендованных упражнений для текущего пользователя.

        Рекомендации учитывают уровень владения пользователя и его прошлые результаты.

        Приоритет отдаётся упражнениям, которые пользователь ещё не пробовал или где
        результат был ниже 90%.'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: 5
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseSummaryResponse'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseSummaryResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseSummaryResponse'
  /api/v1/groups:
    get:
      tags:

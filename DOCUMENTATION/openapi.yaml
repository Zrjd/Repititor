tags:
- name: Admin
  description: 'Платформенные административные операции: статистика, управление пользователями
    и очистка журналов ИИ.

    Доступно только администратору: роль учителя ограничена собственными курсами и
    уроками.'
- name: AdminCatalog
- name: Ai
- name: Auth
- name: Catalog
- name: Decks
- name: Dictionary
- name: Exercises
- name: MyGroups
  description: 'Группы ученика: список групп, в которых он занимается, и вступление
    по коду-приглашению.

    Курсы группы выдаются ученику сразу при вступлении, отдельная запись не требуется.'
- name: Practice
- name: Speech
- name: Teacher
  description: 'Кабинет учителя: собственные курсы и уроки.

    Все операции работают только с материалами текущего учителя — чужие курсы и уроки

    возвращают 403, администратору доступны все курсы.'
- name: TeacherGroups
  description: 'Учебные группы учителя: набор учеников (в том числе группа из одного
    ученика —

    персональные занятия) и курсы, доступные участникам группы.

    Назначение курса сразу зачисляет всех участников, поэтому отдельная запись ученика
    не нужна.

    Чужие группы возвращают 403, администратору доступны все.'
- name: Tutor
- name: Users

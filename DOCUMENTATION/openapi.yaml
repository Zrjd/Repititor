openapi: 3.0.4
info:
  title: Repetitor API
  description: REST API сервиса для изучения иностранных языков (Android / Web). Интервальное
    повторение, словарь с семантическим поиском (pgvector), генерация упражнений,
    чат-репетитор, TTS/STT и оценка произношения.
  contact:
    name: Repetitor
  version: v1
paths:
  /api/v1/admin/stats:
    get:
      tags:
      - Admin
      summary: 'Возвращает агрегированную статистику платформы для панели администратора.

        Включает количество пользователей, активных за 7 дней, контент (курсы, уроки,
        слова),

        статистику повторений, упражнений и использования ИИ с оценкой стоимости.'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: {}
            application/json:
              schema: {}
            text/json:
              schema: {}
  /api/v1/admin/users:
    get:
      tags:
      - Admin
      summary: 'Возвращает постраничный список пользователей с возможностью поиска
        по email или имени.

        Поиск нормализует введённый текст для регистронезависимого сравнения.

        Результат включает основные профильные данные: роль, уровень, XP, серию дней
        и статус аккаунта.'
      parameters:
      - name: Page
        in: query
        schema:
          maximum: 2147483647
          minimum: 1
          type: integer
          format: int32
      - name: PageSize
        in: query
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
      - name: query
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ObjectPagedResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectPagedResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ObjectPagedResponse'
  /api/v1/admin/users/{id}/role:
    patch:
      tags:
      - Admin
      summary: 'Изменяет роль пользователя (например, назначение преподавателя или
        снятие прав администратора).

        Возвращает 404, если пользователь с указанным идентификатором не найден.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: role
        in: query
        schema:
          $ref: '#/components/schemas/UserRole'
      responses:
        '204':
          description: No Content
  /api/v1/admin/users/{id}/active:
    patch:
      tags:
      - Admin
      summary: 'Активирует или деактивирует аккаунт пользователя.

        Деактивированный пользователь теряет доступ к системе, но его данные сохраняются.

        Возвращает 404, если пользователь не найден.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: active
        in: query
        schema:
          type: boolean
          default: true
      responses:
        '204':
          description: No Content
  /api/v1/admin/ai-logs:
    delete:
      tags:
      - Admin
      summary: 'Удаляет журналы вызовов ИИ старше указанного количества дней (по умолчанию
        30).

        Используется для освобождения места в базе данных и соблюдения политики хранения
        данных.

        Операция необратима — удалённые записи восстановить невозможно.'
      parameters:
      - name: olderThanDays
        in: query
        schema:
          type: integer
          format: int32
          default: 30
      responses:
        '204':
          description: No Content
  /api/v1/admin/courses:
    get:
      tags:
      - AdminCatalog
      summary: 'Возвращает список курсов для панели управления, включая неопубликованные.

        Поддерживает фильтрацию по языку и возможность скрыть неопубликованные курсы.

        Включает количество уроков и дату создания для каждого курса.

        Учитель видит только свои курсы, администратор — все.'
      parameters:
      - name: languageId
        in: query
        schema:
          type: string
          format: uuid
      - name: includeUnpublished
        in: query
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCourseResponse'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCourseResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCourseResponse'
    post:
      tags:
      - AdminCatalog
      summary: 'Создаёт новый курс в каталоге.

        Проверяет существование указанного языка перед созданием.

        Курс учителя создаётся в статусе черновика и принадлежит ему.

        Возвращает 201 с данными созданного курса и ссылкой на получение его деталей.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
      responses:
        '201':
          description: Created
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AdminCourseResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCourseResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AdminCourseResponse'
  /api/v1/admin/courses/{id}:
    get:
      tags:
      - AdminCatalog
      summary: 'Получает детальную информацию о курсе по идентификатору для редактирования
        в панели управления.

        Возвращает 404, если курс не найден, и 403, если курс принадлежит другому
        учителю.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AdminCourseResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCourseResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AdminCourseResponse'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      tags:
      - AdminCatalog
      summary: 'Обновляет параметры существующего курса.

        Поддерживает частичное обновление — изменяются только переданные поля.

        При смене языка проверяет его существование. Возвращает 404, если курс не
        найден,

        и 403, если курс принадлежит другому учителю.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateCourseRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AdminCourseResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCourseResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AdminCourseResponse'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
      - AdminCatalog
      summary: 'Удаляет курс из каталога вместе со связанными данными.

        Операция необратима. Возвращает 404, если курс не найден,

        и 403, если курс принадлежит другому учителю.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/admin/courses/{id}/publish:
    post:
      tags:
      - AdminCatalog
      summary: 'Публикует курс или снимает его с публикации.

        Учитель может публиковать только свои курсы, администратор — любые.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: published
        in: query
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AdminCourseResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCourseResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AdminCourseResponse'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/admin/courses/{id}/lessons:
    get:
      tags:
      - AdminCatalog
      summary: 'Возвращает список всех уроков указанного курса для управления содержимым.

        Уроки сортируются по порядковому номеру. Включает полные данные каждого урока.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminLessonResponse'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminLessonResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminLessonResponse'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/admin/lessons:
    post:
      tags:
      - AdminCatalog
      summary: 'Создаёт новый урок в указанном курсе.

        Учитель может создать урок только в своём курсе.

        Возвращает 201 с данными созданного урока и ссылкой на получение его деталей.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLessonRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateLessonRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateLessonRequest'
      responses:
        '201':
          description: Created
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AdminLessonResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLessonResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AdminLessonResponse'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/admin/lessons/{id}:
    get:
      tags:
      - AdminCatalog
      summary: 'Получает детальную информацию об уроке по идентификатору для редактирования.

        Возвращает 404, если урок не найден, и 403, если он принадлежит курсу другого
        учителя.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AdminLessonResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLessonResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AdminLessonResponse'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      tags:
      - AdminCatalog
      summary: 'Обновляет параметры существующего урока.

        Поддерживает частичное обновление — изменяются только переданные поля.

        Возвращает 404, если урок не найден, и 403, если он принадлежит курсу другого
        учителя.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLessonRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateLessonRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateLessonRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AdminLessonResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLessonResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AdminLessonResponse'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
      - AdminCatalog
      summary: 'Удаляет урок из курса.

        Операция необратима. Возвращает 404, если урок не найден,

        и 403, если он принадлежит курсу другого учителя.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/admin/lessons/{id}/generate:
    post:
      tags:
      - AdminCatalog
      summary: 'Генерирует содержимое урока с помощью ИИ на основе указанной темы,
        уровня и требований.

        Использует текущие настройки промпта из конфигурации системы.

        Возвращает заголовок, краткое описание, Markdown-контент и ключевую лексику.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateLessonContentRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/GenerateLessonContentRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/GenerateLessonContentRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GenerateLessonContentResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateLessonContentResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/GenerateLessonContentResponse'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/admin/courses/{id}/generate:
    post:
      tags:
      - AdminCatalog
      summary: 'Генерирует структуру курса с помощью ИИ: описание и список заголовков
        уроков на основе темы и уровня.

        Позволяет быстро создать каркас курса, который затем можно доработать вручную.

        Возвращает 404, если курс не найден, и 403, если курс принадлежит другому
        учителю.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateCourseContentRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/GenerateCourseContentRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/GenerateCourseContentRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GenerateCourseContentResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateCourseContentResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/GenerateCourseContentResponse'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/admin/ai-settings:
    get:
      tags:
      - AdminCatalog
      summary: 'Возвращает текущие настройки ИИ: провайдеры, модели, температуру,
        лимиты токенов и промпт для уроков.

        Объединяет значения из конфигурации приложения с переопределениями из базы
        данных.'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AiSettingsResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettingsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AiSettingsResponse'
    put:
      tags:
      - AdminCatalog
      summary: 'Обновляет настройки ИИ, сохраняя их в базе данных как JSON.

        Поддерживает частичное обновление — изменяются только переданные поля.

        Позволяет настроить провайдеров, модели, температуру, лимиты и промпт для
        генерации уроков.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAiSettingsRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateAiSettingsRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateAiSettingsRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AiSettingsResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettingsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AiSettingsResponse'
  /api/v1/admin/ai-settings/test:
    post:
      tags:
      - AdminCatalog
      summary: 'Проверяет подключение к указанному провайдеру ИИ, отправляя тестовый
        запрос.

        Измеряет задержку ответа и возвращает результат с указанием используемой модели.

        При ошибке возвращает 200 с флагом неуспеха и описанием проблемы.'
      parameters:
      - name: provider
        in: query
        schema:
          type: string
      - name: model
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AiTestResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AiTestResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AiTestResponse'
  /api/v1/ai/providers:
    get:
      tags:
      - Ai
      summary: 'Возвращает список всех сконфигурированных провайдеров ИИ с их настройками.

        Позволяет клиенту отображать доступные модели и их возможности (стриминг,
        JSON-режим, измерения эмбеддингов).

        Доступен без аутентификации, так как информация не содержит секретных данных.'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiProviderResponse'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiProviderResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiProviderResponse'
  /api/v1/ai/providers/{name}/health:
    post:
      tags:
      - Ai
      summary: 'Проверяет работоспособность указанного провайдера ИИ, отправляя тестовый
        запрос.

        Измеряет задержку ответа и возвращает используемую модель.

        При ошибке возвращает 503 с описанием проблемы, что позволяет мониторингу
        отслеживать состояние сервисов.'
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: {}
            application/json:
              schema: {}
            text/json:
              schema: {}
  /api/v1/ai/usage:
    get:
      tags:
      - Ai
      summary: 'Возвращает статистику использования ИИ за указанный период (по умолчанию
        30 дней).

        Администраторы и преподаватели могут просматривать статистику всех пользователей,

        остальные пользователи видят только свои данные. Включает разбивку по провайдерам
        и дням.'
      parameters:
      - name: days
        in: query
        schema:
          type: integer
          format: int32
          default: 30
      - name: allUsers
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AiUsageResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AiUsageResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AiUsageResponse'
  /api/v1/ai/dictionary/reindex:
    post:
      tags:
      - Ai
      summary: 'Пересоздаёт индекс эмбеддингов словаря для полнотекстового и семантического
        поиска.

        Позволяет указать провайдера, размер пакета и ограничение на количество записей.

        Параметр force принудительно пересоздаёт существующие эмбеддинги.

        Операция глобальная и расходует квоту ИИ, поэтому доступна только администратору.'
      parameters:
      - name: provider
        in: query
        schema:
          type: string
      - name: batchSize
        in: query
        schema:
          type: integer
          format: int32
          default: 64
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: 1000
      - name: force
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ReindexResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ReindexResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ReindexResponse'
  /api/v1/ai/limits:
    get:
      tags:
      - Ai
      summary: 'Возвращает текущие ограничения системы: лимиты на импорт слов, размер
        колоды,

        количество бесплатных вызовов ИИ в день, параметры повторений и поддерживаемые
        типы упражнений.

        Используется клиентом для отображения актуальных ограничений и настройки пользовательского
        интерфейса.'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: {}
            application/json:
              schema: {}
            text/json:
              schema: {}
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      summary: 'Регистрирует нового пользователя в системе.

        Создаёт аккаунт с указанным email и паролем, проверяет уникальность email,

        устанавливает языки по умолчанию и выдаёт пару токенов доступа.

        Роль выбирается при регистрации: ученик или учитель (создаёт собственные курсы);

        роль администратора недоступна для самостоятельной регистрации.

        Также создаёт стартодеку "Мои слова" для нового пользователя.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TokenResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '409':
          description: Conflict

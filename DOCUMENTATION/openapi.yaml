                  $ref: '#/components/schemas/GrammarTopicResponse'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GrammarTopicResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GrammarTopicResponse'
  /api/v1/catalog/grammar/{id}:
    get:
      tags:
      - Catalog
      summary: 'Получает детальную информацию о грамматической теме по уникальному

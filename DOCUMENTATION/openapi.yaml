      summary: 'Возвращает список колод текущего пользователя.

        По умолчанию показывает только активные колоды; при includeArchived = true
        включает и архивные.

        Для каждой колоды подсчитывает количество карточек к повторению, новых и выученных.'
      parameters:
      - name: includeArchived
        in: query
        schema:
          type: boolean

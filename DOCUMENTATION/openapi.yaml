        Учитывает целевой язык и уровень владения пользователя.'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/WordOfTheDayResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/WordOfTheDayResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/WordOfTheDayResponse'

openapi: 3.0.4
info:
  title: Repetitor API
  description: REST API сервиса для изучения иностранных языков (Android / Web). Интервальное
    повторение, словарь с семантическим поиском (pgvector), генерация упражнений,
    чат-репетитор, TTS/STT и оценка произношения.
  contact:
    name: Repetitor
  version: v1

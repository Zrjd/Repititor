                  $ref: '#/components/schemas/LexicalUnitResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LexicalUnitResponse'
  /api/v1/dictionary/words/import:
    post:
      tags:
      - Dictionary
      summary: 'Массово импортирует слова из текста (например, в формате TSV — слово,
        перевод, транскрипция, пример).

        При импорте проверяются дубликаты: существующие слова обновляются, новые —

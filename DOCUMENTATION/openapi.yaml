  /api/v1/practice/due:
    get:
      tags:
      - Practice
      summary: 'Возвращает карточки, которые готовы к повторению (due cards).

        Используется для начала сессии практики — показывает пользователю, что нужно
        повторить сейчас.

        Можно фильтровать по конкретной колоде через deckId и ограничивать количество
        через limit.'
      parameters:
      - name: deckId

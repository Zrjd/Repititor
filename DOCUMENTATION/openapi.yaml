                $ref: '#/components/schemas/UserWordResponsePagedResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/UserWordResponsePagedResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/UserWordResponsePagedResponse'

          application/json:
            schema:
              $ref: '#/components/schemas/SubmitExerciseRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/SubmitExerciseRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SubmitExerciseRequest'
      responses:
        '200':
          description: OK

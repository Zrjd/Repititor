      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PracticeSessionResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeSessionResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PracticeSessionResponse'
  /api/v1/practice/due/count:
    get:
      tags:
      - Practice
      summary: 'Возвращает количество карточек, готовых к повторению.

        Нужен для отображения счётчика "сколько карточек ждёт повторения" без загрузки
        самих карточек.

        Полезно для бейджей и уведомлений в интерфейсе.'
      parameters:
      - name: deckId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: {}
            application/json:
              schema: {}
            text/json:
              schema: {}
  /api/v1/practice/forecast:
    get:
      tags:
      - Practice
      summary: 'Строит прогноз нагрузки на ближайшие 14 дней.

        Показывает, сколько карточек будет готово к повторению каждый день, чтобы
        пользователь мог спланировать своё время.

        Используется для визуализации расписания повторений в календаре или графике.'
      parameters:
      - name: deckId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PracticeSummaryResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeSummaryResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PracticeSummaryResponse'
  /api/v1/practice/reviews:
    post:
      tags:
      - Practice
      summary: 'Принимает результаты повторения карточек и обновляет их состояние.

        Сохраняет оценку пользователя, затраченное время и данный ответ для каждой
        карточки.

        После этого алгоритм интервальных повторений пересчитывает дату следующего
        показа карточки.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewSubmissionRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ReviewSubmissionRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ReviewSubmissionRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewResultResponse'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewResultResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewResultResponse'
  /api/v1/practice/summary:
    post:
      tags:
      - Practice
      summary: 'Возвращает сводку по завершённой сессии практики.

        Показывает статистику: сколько карточек повторено, сколько правильных ответов,
        заработано XP и прогноз на 14 дней.

        Используется для экрана результатов после завершения сессии повторения.'
      parameters:
      - name: deckId
        in: query
        schema:
          type: string
          format: uuid
      - name: reviewed
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - name: correct
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - name: again
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - name: newSeen
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - name: xp
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PracticeSummaryResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeSummaryResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PracticeSummaryResponse'
  /api/v1/practice/suspend/{reviewCardId}:
    post:
      tags:
      - Practice
      summary: 'Приостанавливает или возобновляет показ карточки в повторениях.

        Приостановленная карточка не будет появляться в сессиях практики, пока пользователь
        не снимет приостановку.

        Полезно, когда пользователь хочет временно исключить слово из повторения без
        удаления.'
      parameters:
      - name: reviewCardId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: suspended
        in: query
        schema:
          type: boolean
          default: true
      responses:
        '204':
          description: No Content
  /api/v1/practice/prefetch-embeddings:
    post:
      tags:
      - Practice
      summary: 'Предварительно вычисляет и сохраняет векторные представления (embeddings)
        для последних добавленных слов пользователя.

        Нужен для ускорения семантического поиска — без предварительного вычисления
        поиск будет медленным.

        Рекомендуется вызывать после массового импорта слов или добавления новых карточек.'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: 200
      responses:
        '200':
          description: OK
  /api/v1/speech/synthesize:
    post:
      tags:
      - Speech
      summary: 'Синтезирует речь из текста (Text-to-Speech).

        Преобразует переданный текст в аудиофайл с выбранным голосом и скоростью.

        Возвращает URL для воспроизведения и метаданные аудио (тип, размер).

        Используется для озвучки слов и фраз при обучении.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SynthesizeRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/SynthesizeRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SynthesizeRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SynthesizeResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/SynthesizeResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/SynthesizeResponse'
        '503':
          description: Service Unavailable
  /api/v1/speech/transcribe:
    post:
      tags:
      - Speech
      summary: 'Распознаёт речь из аудиофайла (Speech-to-Text).

        Принимает аудиозапись, определяет язык и преобразует речь в текст.

        Возвращает полный текст, длительность, сегменты с временными метками

        и уверенностью распознавания. Также сохраняет аудиофайл в хранилище.'
      parameters:
      - name: Language
        in: query
        schema:
          maxLength: 8
          minLength: 2
          type: string
      - name: Prompt
        in: query
        schema:
          maxLength: 2000
          minLength: 0
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - Audio
              type: object
              properties:
                Audio:
                  type: string
                  format: binary
            encoding:
              Audio:
                style: form
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TranscriptionResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/TranscriptionResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '413':
          description: Content Too Large
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/speech/pronunciation:
    post:
      tags:
      - Speech
      summary: 'Оценивает произношение пользователя по аудиозаписи.

        Сравнивает распознанную речь с целевым текстом и вычисляет оценки

        по нескольким критериям: точность, беглость, полнота, просодия.

        Сохраняет попытку в базу, начисляет XP и возвращает детальный разбор

        с оценками на уровне отдельных слов и подсказками.'
      parameters:
      - name: TargetText
        in: query
        required: true
        schema:
          maxLength: 2000
          minLength: 1
          type: string
      - name: Transcript
        in: query
        schema:
          maxLength: 4000
          minLength: 0
          type: string
      - name: Language
        in: query
        schema:
          maxLength: 8
          minLength: 2
          type: string
      - name: LexicalUnitId
        in: query
        schema:
          type: string
          format: uuid
      - name: Provider
        in: query
        schema:
          maxLength: 64
          minLength: 0
          type: string
      - name: UseAi
        in: query
        schema:
          type: boolean
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - Audio
              type: object
              properties:
                Audio:
                  type: string
                  format: binary
            encoding:
              Audio:
                style: form
      responses:
        '201':
          description: Created
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PronunciationResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PronunciationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PronunciationResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/speech/pronunciation/attempts:
    get:
      tags:
      - Speech
      summary: 'Возвращает историю попыток оценки произношения текущего пользователя.

        Результат отсортирован по дате (новые сверху), количество ограничивается

        параметром limit (1–200). Используется для просмотра прогресса

        и повторного просмотра результатов предыдущих попыток.'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PronunciationResponse'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PronunciationResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PronunciationResponse'
  /api/v1/speech/recordings:
    get:
      tags:
      - Speech
      summary: 'Возвращает список аудиозаписей текущего пользователя.

        Включает все загруженные медиафайлы: записи произношения,

        распознавания речи и другие. Для каждой записи возвращается

        метаданные и временный URL для доступа к файлу.'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items: {}
            application/json:
              schema:
                type: array
                items: {}
            text/json:
              schema:
                type: array
                items: {}
  /api/v1/speech/recordings/{id}:
    delete:
      tags:
      - Speech
      summary: 'Удаляет аудиозапись пользователя по идентификатору.

        Файл удаляется из хранилища и запись из базы данных.

        Доступна только владельцу записи — при попытке удалить чужую

        запись возвращается 404 Not Found.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
  /api/v1/teacher/courses:
    get:
      tags:
      - Teacher
      summary: 'Возвращает все курсы учителя, включая черновики.

        Поддерживает фильтрацию по языку и по статусу публикации.'
      parameters:
      - name: languageId
        in: query
        schema:
          type: string
          format: uuid
      - name: includeUnpublished
        in: query
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCourseResponse'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCourseResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCourseResponse'
    post:
      tags:
      - Teacher

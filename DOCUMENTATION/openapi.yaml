          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GrammarTopicResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/GrammarTopicResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/GrammarTopicResponse'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/decks:

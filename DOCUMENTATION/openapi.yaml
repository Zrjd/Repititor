              $ref: '#/components/schemas/CreateDeckRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateDeckRequest'
      responses:
        '201':
          description: Created
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DeckResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DeckResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DeckResponse'
  /api/v1/decks/{id}:
    get:
      tags:
      - Decks
      summary: 'Возвращает подробную информацию о конкретной колоде.

        Включает статистику: сколько карточек готово к повторению, сколько новых и
        сколько уже выучено.

        Используется для страницы просмотра колоды перед началом практики.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DeckResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DeckResponse'

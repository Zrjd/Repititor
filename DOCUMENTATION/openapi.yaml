        '204':
          description: No Content
  /api/v1/dictionary/words:
    get:
      tags:
      - Dictionary
      summary: 'Ищет слова в словаре с фильтрацией и пагинацией.

        Поддерживает два режима: обычный текстовый поиск (по префиксу или вхождению)
        и семантический поиск (по смыслу через векторные представления).

        Можно фильтровать по уровню сложности, части речи и тегам.'
      parameters:
      - name: Query
        in: query
        schema:
          maxLength: 400
          minLength: 0
          type: string
      - name: LanguageId
        in: query
        schema:
          type: string
          format: uuid
      - name: TranslationLanguageId
        in: query
        schema:
          type: string
          format: uuid
      - name: Limit
        in: query
        schema:
          maximum: 200
          minimum: 1
          type: integer
          format: int32
      - name: Page
        in: query
        schema:
          maximum: 200
          minimum: 0
          type: integer
          format: int32
      - name: Semantic
        in: query
        schema:
          type: boolean
      - name: MaxMinLevel
        in: query
        schema:
          $ref: '#/components/schemas/CefrLevel'
      - name: Tags
        in: query
        schema:
          type: array
          items:
            type: string
      - name: PartOfSpeech
        in: query
        schema:
          $ref: '#/components/schemas/PartOfSpeech'
      - name: Provider
        in: query
        schema:
          type: string
      - name: MinSimilarity
        in: query
        schema:
          maximum: 1
          minimum: 0
          type: number
          format: double
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/LexicalUnitResponsePagedResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/LexicalUnitResponsePagedResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/LexicalUnitResponsePagedResponse'
    post:
      tags:
      - Dictionary
      summary: 'Создаёт новое слово в словаре и автоматически добавляет его к пользователю.

        Проверяет на дубликаты — если такое слово уже есть, возвращает ошибку конфликта.

        При необходимости сразу вычисляет векторное представление для семантического
        поиска.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLexicalUnitRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateLexicalUnitRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateLexicalUnitRequest'
      responses:
        '201':
          description: Created
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/LexicalUnitResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/LexicalUnitResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/LexicalUnitResponse'
  /api/v1/dictionary/words/{id}:
    get:
      tags:
      - Dictionary
      summary: 'Возвращает полную информацию о слове по его идентификатору.

        Включает перевод, транскрипцию, примеры, теги и другие метаданные слова.

